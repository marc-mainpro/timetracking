          minItems: 1
          uniqueItems: true
    DayRulePayload:
      type: object
      description: 'Regla semanal: si el dia de la semana es laborable y cuantos minutos se esperan'
      properties:
        dayOfWeek:
          type: string
          enum:
          - MONDAY
          - TUESDAY
          - WEDNESDAY
          - THURSDAY
          - FRIDAY
          - SATURDAY
          - SUNDAY
          example: MONDAY
        working:
          type: boolean
        expectedMinutes:
          type: integer
          format: int32
          example: 480
          maximum: 1440
          minimum: 0
      required:
      - dayOfWeek
    HolidayPayload:
      type: object
      description: Festivo en una fecha local del calendario
      properties:
        date:
          type: string
          format: date
          example: '2026-01-06'
        name:
          type: string
          example: Reyes
          maxLength: 120
          minLength: 0
      required:
      - date
    SaveCalendarRequest:
      type: object
      description: Estado completo de un calendario laboral
      properties:
        name:
          type: string
          example: Calendario general
          maxLength: 120
          minLength: 0
        timezone:
          type: string
          description: Zona horaria IANA; por defecto la configurada
          example: Europe/Madrid
          maxLength: 60
          minLength: 0
        validFrom:
          type: string
          format: date
          example: '2026-01-01'
        validTo:
          type: string
          format: date
          description: Fin de vigencia inclusivo; null = indefinida
          example: '2026-12-31'
        dayRules:
          type: array
          items:
            $ref: '#/components/schemas/DayRulePayload'
        holidays:
          type: array
          items:
            $ref: '#/components/schemas/HolidayPayload'
        specialDays:
          type: array
          items:
            $ref: '#/components/schemas/SpecialDayPayload'
      required:
      - validFrom
    SpecialDayPayload:
      type: object
      description: Jornada especial que sustituye la regla semanal en una fecha concreta
      properties:
        date:
          type: string
          format: date
          example: '2026-12-24'
        name:
          type: string
          example: Jornada intensiva de Nochebuena
          maxLength: 120
          minLength: 0
        expectedMinutes:
