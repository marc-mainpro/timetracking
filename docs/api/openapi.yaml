components:
  schemas:
    UpdateEmployeeRequest:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
    EmployeeResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        status:
          type: string
        roles:
          type: array
          items:
            type: string
          uniqueItems: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AssignRolesRequest:
      type: object
      properties:
        roles:
          type: array
          items:
            type: string
          minItems: 1
          uniqueItems: true
    HourlyRulesRequest:
      type: object
      description: Configuracion de reglas horarias del tenant
      properties:
        maxDailyWorkMinutes:
          type: integer
          format: int32
          description: Maximo de minutos trabajados por jornada
          example: 480
        requiredBreakMinutes:
          type: integer
          format: int32
          description: Minimo de minutos de pausa requeridos
          example: 30
        roundingStepMinutes:
          type: integer
          format: int32
          description: Paso de redondeo en minutos
          example: 15
        toleranceMinutes:
          type: integer
          format: int32
          description: Tolerancia en minutos
          example: 5
    HourlyRulesResponse:
      type: object
      description: Reglas horarias efectivas del tenant
      properties:
        maxDailyWorkMinutes:
          type: integer
          format: int32
          description: Maximo de minutos trabajados por jornada
          example: 480
        requiredBreakMinutes:
          type: integer
          format: int32
          description: Minimo de minutos de pausa requeridos
          example: 30
        roundingStepMinutes:
          type: integer
          format: int32
          description: Paso de redondeo en minutos
          example: 15
        toleranceMinutes:
          type: integer
          format: int32
          description: Tolerancia en minutos
          example: 5
    DayRulePayload:
      type: object
      description: 'Regla semanal: si el dia de la semana es laborable y cuantos minutos se esperan'
      properties:
        dayOfWeek:
          type: string
          enum:
          - MONDAY
          - TUESDAY
          - WEDNESDAY
          - THURSDAY
          - FRIDAY
          - SATURDAY
          - SUNDAY
          example: MONDAY
        working:
          type: boolean
        expectedMinutes:
          type: integer
          format: int32
          example: 480
          maximum: 1440
          minimum: 0
      required:
      - dayOfWeek
    HolidayPayload:
      type: object
      description: Festivo en una fecha local del calendario
      properties:
        date:
          type: string
          format: date
          example: '2026-01-06'
        name:
          type: string
          example: Reyes
          maxLength: 120
          minLength: 0
      required:
      - date
    SaveCalendarRequest:
      type: object
      description: Estado completo de un calendario laboral
      properties:
        name:
          type: string
          example: Calendario general
          maxLength: 120
          minLength: 0
        timezone:
          type: string
          description: Zona horaria IANA; por defecto la configurada
          example: Europe/Madrid
          maxLength: 60
          minLength: 0
        validFrom:
          type: string
          format: date
          example: '2026-01-01'
        validTo:
          type: string
          format: date
          description: Fin de vigencia inclusivo; null = indefinida
          example: '2026-12-31'
        dayRules:
          type: array
          items:
            $ref: '#/components/schemas/DayRulePayload'
        holidays:
          type: array
          items:
            $ref: '#/components/schemas/HolidayPayload'
        specialDays:
          type: array
          items:
            $ref: '#/components/schemas/SpecialDayPayload'
      required:
      - validFrom
    SpecialDayPayload:
      type: object
      description: Jornada especial que sustituye la regla semanal en una fecha concreta
      properties:
        date:
          type: string
          format: date
          example: '2026-12-24'
        name:
          type: string
          example: Jornada intensiva de Nochebuena
          maxLength: 120
          minLength: 0
        expectedMinutes:
          type: integer
          format: int32
          example: 300
          maximum: 1440
          minimum: 0
      required:
      - date
    CalendarDetailResponse:
      type: object
      description: Detalle de un calendario laboral
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        timezone:
          type: string
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
        status:
          type: string
        dayRules:
          type: array
          items:
            $ref: '#/components/schemas/DayRulePayload'
        holidays:
          type: array
          items:
            $ref: '#/components/schemas/HolidayPayload'
        specialDays:
          type: array
          items:
            $ref: '#/components/schemas/SpecialDayPayload'
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CorrectionRequestDto:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
          minLength: 0
        proposedChanges:
          $ref: '#/components/schemas/ProposedChangesDto'
      required:
      - proposedChanges
    ProposedBreakDto:
      type: object
      properties:
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
      required:
      - endedAt
      - startedAt
    ProposedChangesDto:
      type: object
      properties:
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        breaks:
          type: array
          items:
            $ref: '#/components/schemas/ProposedBreakDto'
          maxItems: 24
          minItems: 0
      required:
      - breaks
      - endedAt
      - startedAt
    CorrectionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workdayId:
          type: string
          format: uuid
        requestedBy:
          type: string
          format: uuid
        reason:
          type: string
        proposedChanges:
          $ref: '#/components/schemas/ProposedChangesResponse'
        status:
          type: string
        resolvedBy:
          type: string
          format: uuid
        resolvedAt:
          type: string
          format: date-time
        resolutionComment:
          type: string
        createdAt:
          type: string
          format: date-time
    ProposedBreakResponse:
      type: object
      properties:
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
    ProposedChangesResponse:
      type: object
      properties:
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        breaks:
          type: array
          items:
            $ref: '#/components/schemas/ProposedBreakResponse'
    BreakEntryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
    WorkdayEvaluationResponse:
      type: object
      properties:
        expectedDuration:
          type: string
          example: PT2H30M
        workedDuration:
          type: string
          example: PT2H30M
        effectiveWorkedDuration:
          type: string
          example: PT2H30M
        pausedDuration:
          type: string
          example: PT2H30M
        overtimeDuration:
          type: string
          example: PT2H30M
        deviationDuration:
          type: string
          example: PT2H30M
        anomalies:
          type: array
          items:
