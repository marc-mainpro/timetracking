          format: uuid
        status:
          type: string
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        breaks:
          type: array
          items:
            $ref: '#/components/schemas/BreakEntryResponse'
        workedDuration:
          type: string
