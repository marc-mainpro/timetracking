services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-timetracking}
      POSTGRES_USER: ${POSTGRES_USER:-timetracking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-timetracking} -d ${POSTGRES_DB:-timetracking}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Servidor SMTP de desarrollo (T110-01, ADR-0012). Captura todo el correo
  # saliente y lo muestra en http://localhost:8025 en vez de entregarlo: es la
  # única forma de ver los tokens de verificación y de recuperación, que nunca
  # se registran en los logs (RS-014). No debe desplegarse en producción.
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-timetracking}
      DB_USER: ${POSTGRES_USER:-timetracking}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es obligatorio (minimo 32 bytes); definelo en .env}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:4200}
      AUTH_REFRESH_COOKIE_SECURE: ${AUTH_REFRESH_COOKIE_SECURE:-false}
      # Enlace del correo de recuperacion (RF-USR-006). Se deriva de
      # FRONTEND_ORIGIN porque el enlace lo abre el navegador del usuario, no el
      # backend: sin esto el correo apuntaria a localhost en cualquier entorno.
      # Debe conservar un unico %s, que es donde se inserta el token.
      AUTH_PASSWORD_RESET_URL_TEMPLATE: ${AUTH_PASSWORD_RESET_URL_TEMPLATE:-${FRONTEND_ORIGIN:-http://localhost:4200}/restablecer-contrasena?token=%s}
      # Aprovisionamiento controlado del PLATFORM_ADMIN inicial (T50-04).
      # Si se dejan vacios, no se crea ningun usuario de plataforma.
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      # Registro público autoservicio (RF-TEN-010): habilitado por defecto;
      # cada solicitud sigue exigiendo verificación de correo y aprobación de
      # un PLATFORM_ADMIN antes de que exista ningún tenant.
      PUBLIC_REGISTRATION_ENABLED: ${PUBLIC_REGISTRATION_ENABLED:-true}
      # Enlace del correo de verificacion (RF-REG-004). Mismo motivo que el de
      # recuperacion: lo compone el job del outbox, sin peticion HTTP de la que
      # deducir el dominio. Debe conservar un unico %s para el token.
      REGISTRATION_VERIFICATION_URL: ${REGISTRATION_VERIFICATION_URL:-${FRONTEND_ORIGIN:-http://localhost:4200}/registro/verificar?token=%s}
      APP_REQUEST_MAX_PAYLOAD_BYTES: ${APP_REQUEST_MAX_PAYLOAD_BYTES:-65536}
      # Correo saliente (T110-01). Apunta a mailpit en desarrollo.
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_FROM: ${MAIL_FROM:-no-reply@timetracking.local}
      # Base del enlace de las notificaciones por correo (T170-09). Se deriva
      # del origen del frontend, igual que los enlaces de verificacion.
      NOTIFICATION_APP_BASE_URL: ${NOTIFICATION_APP_BASE_URL:-${FRONTEND_ORIGIN:-http://localhost:4200}}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Destino del proxy_pass de nginx (frontend/nginx.conf.template). Aquí es
      # el nombre del servicio, que resuelve el DNS interno de Docker; en un
      # despliegue gestionado lo inyecta la plataforma.
      BACKEND_HOSTPORT: backend:8080
    ports:
      - "4200:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
