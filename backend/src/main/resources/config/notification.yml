# Notificaciones (T110-05, RF-NOT-005).
#
# El envio por correo se hace en una tarea aparte del consumo del evento: crear
# la notificacion es una escritura local que no debe depender de que el SMTP
# responda.
notification:
  delivery:
    enabled: ${NOTIFICATION_DELIVERY_ENABLED:true}
    poll-interval: PT30S
    batch-size: 50
    # Tras agotarlos la notificacion queda FAILED, pero sigue visible en la
    # aplicacion: que el correo no saliera no significa que el usuario no deba
    # enterarse del hecho.
    max-attempts: 5
  email:
    # Base absoluta del frontend con la que se compone el enlace de cada
    # notificación (T170-09). Sin ella el correo sale igual, pero sin enlace.
    app-base-url: ${NOTIFICATION_APP_BASE_URL:http://localhost:4200}
