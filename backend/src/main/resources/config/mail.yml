# Correo saliente (T110-01, ADR-0012).
#
# mail.enabled=false por defecto: sin proveedor configurado el contenedor
# levanta LoggingEmailSender, que solo registra destinatario y asunto. Asi ni
# los tests ni un arranque local sin mailpit intentan abrir una conexion real.
#
# Con mail.enabled=true, mail.provider=smtp usa spring.mail.*; y
# mail.provider=resend usa la API HTTP de Resend.
mail:
  enabled: ${MAIL_ENABLED:false}
  provider: ${MAIL_PROVIDER:smtp}
  from: ${MAIL_FROM:no-reply@timetracking.local}
  resend:
    base-url: ${RESEND_BASE_URL:https://api.resend.com}
    api-key: ${RESEND_API_KEY:}

spring:
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
