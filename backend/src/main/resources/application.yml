spring:
  application:
    name: timetracking
  # Cada funcionalidad de la V2 aporta su configuración en su propio fichero
  # bajo config/, en vez de añadir un bloque a este application.yml compartido
  # (ADR-0011). Todos los imports son `optional:`, así que un fichero que aún no
  # existe simplemente se ignora: por eso la lista puede declararse entera de
  # antemano y nadie tiene que volver a editar este fichero al añadir su feature.
  # Spring Boot no admite comodines en imports `classpath:`, de ahí la
  # enumeración explícita.
  config:
    import:
      - optional:classpath:config/registration.yml
      - optional:classpath:config/sessions.yml
      - optional:classpath:config/account-lockout.yml
      - optional:classpath:config/password-reset.yml
      - optional:classpath:config/mail.yml
      - optional:classpath:config/calendar.yml
      - optional:classpath:config/absence.yml
      - optional:classpath:config/shift.yml
      - optional:classpath:config/notification.yml
      - optional:classpath:config/observability.yml
      - optional:classpath:config/backup.yml
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never

outbox:
  poll-interval: PT5S
  batch-size: 50
  max-attempts: 8
  claim-timeout: PT5M
  archive-retention: P30D
  archive-cron: "0 0 3 * * *"
  scheduler-enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

auth:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: PT15M
  rate-limit:
    capacity: 10
    window: PT1M
  refresh-token:
    ttl: P14D
    cookie-name: refresh_token
    cookie-path: /api/v1/auth
    cookie-secure: ${AUTH_REFRESH_COOKIE_SECURE:true}

security:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:4200}

platform:
  admin:
    email: ${PLATFORM_ADMIN_EMAIL:}
    password: ${PLATFORM_ADMIN_PASSWORD:}

registration:
  # El alta de tenants también puede hacerse como operación de plataforma
  # (PLATFORM_ADMIN vía POST /api/v1/platform/tenants). El registro público
  # autoservicio está habilitado por defecto; cada solicitud sigue exigiendo
  # verificación de correo y aprobación de un PLATFORM_ADMIN antes de que
  # exista ningún tenant (RF-TEN-010 solo exige poder deshabilitarlo).
  public:
    enabled: ${PUBLIC_REGISTRATION_ENABLED:true}

app:
  request:
    max-payload-bytes: ${APP_REQUEST_MAX_PAYLOAD_BYTES:65536}
