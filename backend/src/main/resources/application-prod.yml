# Perfil de producción: datasource y apagado de la documentación viva. El resto
# de la configuración vive en application.yml y en config/*.yml, que se cargan
# siempre.
#
# La URL admite dos formas, por orden de preferencia:
#
#   1. DB_URL entera, si el entorno puede darla ya en formato JDBC.
#   2. DB_HOST + DB_PORT + DB_NAME, cuando el entorno solo expone las piezas.
#
# Hacen falta las dos porque los proveedores gestionados suelen publicar la
# conexión como `postgresql://user:pass@host/db`, un formato que el driver JDBC
# no entiende, y sus ficheros de despliegue no permiten concatenar cadenas: solo
# pueden inyectar cada pieza por separado. En un despliegue por contenedor a
# mano, en cambio, pasar DB_URL es lo cómodo.
#
# Sin valores por defecto a propósito: si no llega ni DB_URL ni el trío de
# piezas, el arranque falla en vez de apuntar en silencio a otra base de datos.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

# La documentación viva (OpenAPI + Swagger UI) se apaga en producción.
#
# No es que exponerla abra ningún endpoint: la regla sigue siendo
# `anyRequest().authenticated()` y RouteAuthorizationIntegrationTest lo vigila.
# Lo que evita es regalar el reconocimiento: `SharedPublicEndpoints` abre
# /v3/api-docs y /swagger-ui sin autenticar, así que publicarlas en internet
# entrega a cualquiera el inventario completo de rutas, verbos y esquemas de
# request, incluidos los de plataforma y los de registro y recuperación de
# contraseña (OWASP API9: Improper Inventory Management).
#
# Apagarlo aquí no cuesta nada porque nadie consume estas rutas en producción:
# el contrato está versionado en docs/api/openapi.yaml (se exporta desde un
# arranque local), la demo corre en local con docker compose, y el frontend
# llama a la API, no al documento.
#
# `enabled: false` desregistra los endpoints en vez de protegerlos, que es lo
# que hace falta: exigir token en /v3/api-docs no serviría, porque Swagger UI
# carga ese documento antes de que exista ningún token y se quedaría en blanco.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
