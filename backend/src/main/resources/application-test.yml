spring:
  datasource:
    hikari:
      maximum-pool-size: 2
      minimum-idle: 0
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

logging:
  level:
    org.springframework: INFO
    com.tfp.timetracking: DEBUG
    com.zaxxer.hikari: ERROR

# T703: el publicador/archivador en segundo plano se desactiva en el perfil
# de test para que las suites de otras funcionalidades no compitan con un
# @Scheduled real sobre filas de outbox_message que no les conciernen. Los
# tests propios del publicador invocan PublishPendingOutboxMessages /
# ArchivePublishedOutboxMessages directamente (sin depender del cron) y
# reactivan este flag puntualmente via @DynamicPropertySource cuando
# necesitan probar el job programado en si.
outbox:
  scheduler-enabled: false

auth:
  jwt:
    secret: test-jwt-secret-key-with-at-least-32-bytes
    access-token-ttl: PT15M
  rate-limit:
    capacity: 10
    window: PT1M
  refresh-token:
    ttl: P14D
    cookie-name: refresh_token
    cookie-path: /api/v1/auth
    cookie-secure: true

security:
  cors:
    allowed-origin: http://localhost:4200

app:
  request:
    max-payload-bytes: 65536

# El registro público se mantiene habilitado en el perfil de test para que las
# suites que arrancan tenants vía POST /api/v1/auth/register sigan funcionando;
# en producción está deshabilitado por defecto (RF-TEN-010).
registration:
  public:
    enabled: true

# El envio de notificaciones se dispara a mano en los tests que lo prueban: un
# job de fondo enviando correo haria la bateria no determinista (mismo motivo
# que outbox.scheduler-enabled).
notification:
  delivery:
    enabled: false
