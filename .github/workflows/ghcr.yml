name: Build and Publish Docker Images

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io

# Una publicacion cada vez. Las dos imagenes comparten la etiqueta `latest`:
# si dos tags se publican a la vez, el job mas lento puede sobrescribir
# `latest` con la version anterior y dejar backend y frontend en versiones
# distintas, que es lo que despues se redespliega. No se cancela la que este
# en curso para no dejar publicada solo una de las dos imagenes.
concurrency:
  group: ghcr-publish
  cancel-in-progress: false

jobs:
  build-and-push-images:
    name: Build and push (${{ matrix.component }})
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - component: backend
            context: ./backend
          - component: frontend
            context: ./frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (semantic tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
