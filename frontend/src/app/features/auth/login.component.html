<app-auth-shell
  eyebrow="Acceso"
  heading="Entra"
  lede="Usa el correo con el que te dio de alta tu organización."
  >
  <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
    <div class="field">
      <label for="email"><span>Correo</span></label>
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="email"
        placeholder="ana@empresa.test"
        [attr.aria-invalid]="showEmailError() ? 'true' : null"
        [attr.aria-describedby]="showEmailError() ? 'email-error' : null"
        />
      @if (showEmailError()) {
        <div id="email-error" class="validation" role="alert">
          @if (form.controls.email.errors?.['required']) {
            Introduce tu correo.
          } @else {
            Introduce un correo válido.
          }
        </div>
      }
    </div>

    <div class="field">
      <label for="password"><span>Contraseña</span></label>
      <div class="password-field">
        <input
          id="password"
          [type]="passwordVisible() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
          placeholder="Tu contraseña"
          [attr.aria-invalid]="showPasswordError() ? 'true' : null"
          [attr.aria-describedby]="showPasswordError() ? 'password-error' : null"
          />
        <button
          type="button"
          class="password-toggle ghost"
          (click)="togglePassword()"
          [attr.aria-pressed]="passwordVisible()"
          [attr.aria-label]="passwordVisible() ? 'Ocultar la contraseña' : 'Mostrar la contraseña'"
          >
          {{ passwordVisible() ? 'Ocultar' : 'Mostrar' }}
        </button>
      </div>
      @if (showPasswordError()) {
        <div id="password-error" class="validation" role="alert">Introduce tu contraseña.</div>
      }
    </div>

    @if (errorMessage(); as message) {
      <p class="error error--block" role="alert">{{ message }}</p>
    }

    <button type="submit" [disabled]="loading()" [attr.aria-busy]="loading()">
      {{ loading() ? 'Entrando…' : 'Entrar' }}
    </button>
  </form>

  <!-- El alta de organización ya está en la barra superior: repetirla aquí solo
       le quitaría peso a la única acción secundaria de esta pantalla. -->
  <a authLinks class="secondary-link" routerLink="/auth/recuperar-contrasena">
    ¿Has olvidado tu contraseña?
  </a>
</app-auth-shell>
